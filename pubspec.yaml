name: watm_app
description: WATM group accountability application for sustainable weight loss.
publish_to: "none"
version: 0.1.2+3

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  cloud_firestore: ^6.7.1
  firebase_auth: ^6.5.6
  firebase_core: ^4.12.1
  flutter:
    sdk: flutter
  flutter_local_notifications: 19.5.0
  flutter_localizations:
    sdk: flutter
  google_fonts: ">=6.2.1 <8.0.0"
  shared_preferences: ^2.5.3
  timezone: 0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # ملفات خط Alexandria إن وُجدت. حزمة google_fonts تستخدم المحلي
  # تلقائياً وتتوقف عن التنزيل عند الإقلاع — راجع assets/google_fonts/README.txt
  assets:
    - assets/google_fonts/
